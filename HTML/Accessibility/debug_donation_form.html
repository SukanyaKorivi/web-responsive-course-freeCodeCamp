<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
<h1>Donation Form</h1>
<form>

  <p><label for="name">Full Name:</label>
    <input required type="text" id="name" name="name"></p>

  <p><label for="email">Email Address:</label>
    <input required type="email" id="email" name="email"></p>

  <p><label for="amount">Donation Amount ($):</label>
    <input required type="number" id="amount" name="amount"></p>

  <p><label for="subscription">Subscribe</label><input checked type="checkbox" id="subscription" name="newsletter"></p>


  <input type="submit" value="Send">
</form>
</body>
</html>
